<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#4a3aff"> <meta property="og:title" content="Gestione Anagrafica e Rapporti">
    <meta property="og:description" content="App per la gestione di S-21, S-88 e Gruppi di servizio.">
    <meta property="og:image" content="https://asarritzu-boop.github.io/Anagrafica/icona.png">
    <meta property="og:url" content="https://asarritzu-boop.github.io/Anagrafica/">

    <title>Segreteria JW</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>

    <style>
        body { -webkit-tap-highlight-color: transparent; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        .modal-bg { background-color: rgba(0, 0, 0, 0.5); backdrop-filter: blur(5px); }
        .hidden-section { display: none; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 pb-20">

    <header class="bg-indigo-600 text-white p-4 shadow-lg sticky top-0 z-40">
        <div class="max-w-5xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <img src="https://asarritzu-boop.github.io/Anagrafica/icona.png" alt="Icon" class="w-10 h-10 rounded-full bg-white p-1 shadow-sm">
                <div>
                    <h1 class="font-bold text-lg leading-tight">Segreteria</h1>
                    <p class="text-[10px] opacity-80 uppercase tracking-wider">Gestione S-21 & S-88</p>
                </div>
            </div>
            <button onclick="condividiApp()" class="bg-white/20 p-2 rounded-full hover:bg-white/30 transition">
                🔗 <span class="text-xs font-bold hidden sm:inline ml-1">CONDIVIDI</span>
            </button>
        </div>
    </header>

    <main class="max-w-5xl mx-auto p-4 space-y-6">

        <div id="dashboard" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-200">
                <div class="flex items-center gap-3 mb-4">
                    <div class="bg-indigo-100 p-2 rounded-lg text-2xl">👤</div>
                    <h2 class="font-bold text-lg">Proclamatori (S-21)</h2>
                </div>
                <button onclick="nuovaScheda()" class="w-full bg-indigo-600 text-white py-3 rounded-xl font-bold mb-3 shadow-lg shadow-indigo-200 active:scale-95 transition">
                    + NUOVA SCHEDA S-21
                </button>
                <div class="grid grid-cols-2 gap-3">
                    <button onclick="vistaInserisciRapporto()" class="bg-gray-100 text-indigo-700 py-3 rounded-xl font-bold text-xs uppercase border border-gray-200">
                        📝 Inserisci Rapporto
                    </button>
                    <button onclick="vistaMancanti()" class="bg-red-50 text-red-600 py-3 rounded-xl font-bold text-xs uppercase border border-red-100">
                        ⚠️ Mancanti
                    </button>
                </div>
            </div>

            <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-200">
                <div class="flex items-center gap-3 mb-4">
                    <div class="bg-emerald-100 p-2 rounded-lg text-2xl">📊</div>
                    <h2 class="font-bold text-lg">Adunanze (S-88)</h2>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <button onclick="apriS88()" class="bg-emerald-600 text-white py-3 rounded-xl font-bold shadow-lg shadow-emerald-200 active:scale-95 transition">
                        COMPILA S-88
                    </button>
                    <button onclick="scaricaPDF_S88()" class="bg-gray-800 text-white py-3 rounded-xl font-bold text-xs uppercase">
                        📥 Scarica PDF
                    </button>
                </div>
            </div>

            <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-200 md:col-span-2">
                <div class="flex items-center justify-between mb-4">
                    <div class="flex items-center gap-3">
                        <div class="bg-amber-100 p-2 rounded-lg text-2xl">👥</div>
                        <h2 class="font-bold text-lg">Gruppi di Servizio</h2>
                    </div>
                    <button onclick="nuovoGruppoModal()" class="text-xs bg-amber-500 text-white px-3 py-1 rounded-lg font-bold">+ Crea</button>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                    <button onclick="apriRicercaGruppo()" class="bg-amber-50 text-amber-800 py-4 rounded-xl font-bold text-sm border border-amber-100">
                        🔍 Cerca Gruppo
                    </button>
                    <button onclick="vistaTuttiGruppi()" class="bg-amber-50 text-amber-800 py-4 rounded-xl font-bold text-sm border border-amber-100">
                        📄 Lista Gruppi (PDF)
                    </button>
                     <button onclick="apriAnagrafica()" class="bg-blue-50 text-blue-800 py-4 rounded-xl font-bold text-sm border border-blue-100">
                        🔤 Anagrafica Completa
                    </button>
                </div>
            </div>

            <div class="grid grid-cols-3 gap-3 md:col-span-2">
                <button onclick="apriArchivio()" class="bg-white p-4 rounded-xl shadow-sm border flex flex-col items-center gap-2">
                    <span class="text-2xl">🗄️</span> <span class="text-[10px] font-bold uppercase">Archivio</span>
                </button>
                <button onclick="esportaDati()" class="bg-white p-4 rounded-xl shadow-sm border flex flex-col items-center gap-2">
                    <span class="text-2xl">📤</span> <span class="text-[10px] font-bold uppercase">Backup</span>
                </button>
                <label class="bg-white p-4 rounded-xl shadow-sm border flex flex-col items-center gap-2 cursor-pointer">
                    <span class="text-2xl">📥</span> <span class="text-[10px] font-bold uppercase">Importa</span>
                    <input type="file" class="hidden" accept=".json" onchange="importaDati(event)">
                </label>
            </div>
        </div>

        <div id="dynamicSection" class="hidden-section bg-white rounded-2xl shadow-lg border border-gray-200 min-h-[50vh]">
            <div class="p-4 border-b flex justify-between items-center bg-gray-50 rounded-t-2xl">
                <button onclick="chiudiSezione()" class="bg-gray-200 px-3 py-1 rounded-lg font-bold text-xs">← INDIETRO</button>
                <h3 id="sectionTitle" class="font-bold text-lg uppercase text-indigo-800">Titolo</h3>
                <div id="sectionActions"></div>
            </div>
            <div id="sectionContent" class="p-4 overflow-x-auto"></div>
        </div>

    </main>

    <div id="modal" class="fixed inset-0 z-50 modal-bg hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-lg rounded-2xl shadow-2xl overflow-hidden max-h-[90vh] flex flex-col">
            <div class="p-4 border-b flex justify-between items-center bg-gray-50">
                <h3 id="modalTitle" class="font-bold text-lg">Modifica</h3>
                <button onclick="chiudiModal()" class="text-2xl leading-none">&times;</button>
            </div>
            <div id="modalBody" class="p-6 overflow-y-auto"></div>
        </div>
    </div>

    <script>
        // CONFIGURAZIONE & DB
        const BASE_URL = "https://asarritzu-boop.github.io/Anagrafica/";
        const FILES = { s21: "S-21_I.pdf", s88: "S-88_1.pdf" };
        const MESI = ["Settembre", "Ottobre", "Novembre", "Dicembre", "Gennaio", "Febbraio", "Marzo", "Aprile", "Maggio", "Giugno", "Luglio", "Agosto"];
        
        let db = JSON.parse(localStorage.getItem('jw_db')) || {
            membri: [], // { id, nome, cognome, indirizzo, telefono, sesso, nascita, battesimo, privilegi: {}, gruppoId: null, rapporti: { "2023-Settembre": {partecipato: true, studi: 0, ...} } }
            gruppi: [], // { id, nome, sorvegliante, assistente }
            s88: {}     // { "2024": { "Settembre": { infra: 0, week: 0 } } }
        };

        function salvaDB() { localStorage.setItem('jw_db', JSON.stringify(db)); }
        
        // --- FUNZIONI UI CORE ---
        function chiudiSezione() {
            document.getElementById('dynamicSection').classList.add('hidden-section');
            document.getElementById('dashboard').classList.remove('hidden-section');
        }
        function apriSezione(titolo, htmlContent, actionsHtml = "") {
            document.getElementById('dashboard').classList.add('hidden-section');
            const sec = document.getElementById('dynamicSection');
            sec.classList.remove('hidden-section');
            document.getElementById('sectionTitle').innerText = titolo;
            document.getElementById('sectionContent').innerHTML = htmlContent;
            document.getElementById('sectionActions').innerHTML = actionsHtml;
        }
        function apriModal(titolo, html) {
            document.getElementById('modalTitle').innerText = titolo;
            document.getElementById('modalBody').innerHTML = html;
            document.getElementById('modal').classList.remove('hidden');
        }
        function chiudiModal() { document.getElementById('modal').classList.add('hidden'); }

        // --- FEATURE: CONDIVISIONE ---
        function condividiApp() {
            if (navigator.share) {
                navigator.share({
                    title: 'Segreteria JW',
                    text: 'Gestione Anagrafica S-21 & S-88',
                    url: BASE_URL
                });
            } else {
                alert("Condivisione non supportata dal browser. Copia il link manualmente: " + BASE_URL);
            }
        }

        // --- FEATURE: S-21 NUOVO PROFILO ---
        function nuovaScheda(id = null) {
            const m = id ? db.membri.find(x => x.id === id) : null;
            let h = `
                <div class="space-y-4">
                    <input type="hidden" id="pid" value="${id || Date.now()}">
                    <div class="grid grid-cols-2 gap-4">
                        <div><label class="text-xs font-bold uppercase">Nome</label><input type="text" id="pnome" value="${m ? m.nome : ''}" class="w-full border p-2 rounded"></div>
                        <div><label class="text-xs font-bold uppercase">Cognome</label><input type="text" id="pcognome" value="${m ? m.cognome : ''}" class="w-full border p-2 rounded"></div>
                    </div>
                    <div><label class="text-xs font-bold uppercase">Indirizzo</label><input type="text" id="pindirizzo" value="${m ? m.indirizzo : ''}" class="w-full border p-2 rounded"></div>
                    <div><label class="text-xs font-bold uppercase">Telefono</label><input type="tel" id="ptelefono" value="${m ? m.telefono : ''}" class="w-full border p-2 rounded"></div>
                    <div class="grid grid-cols-2 gap-4">
                        <div><label class="text-xs font-bold uppercase">Nascita</label><input type="date" id="pnascita" value="${m ? m.nascita : ''}" class="w-full border p-2 rounded"></div>
                        <div><label class="text-xs font-bold uppercase">Battesimo</label><input type="date" id="pbattesimo" value="${m ? m.battesimo : ''}" class="w-full border p-2 rounded"></div>
                    </div>
                    <div><label class="text-xs font-bold uppercase">Sesso</label>
                        <select id="psesso" class="w-full border p-2 rounded">
                            <option value="M" ${m && m.sesso === 'M' ? 'selected' : ''}>Maschio</option>
                            <option value="F" ${m && m.sesso === 'F' ? 'selected' : ''}>Femmina</option>
                        </select>
                    </div>
                    <div><label class="text-xs font-bold uppercase">Gruppo</label>
                        <select id="pgruppo" class="w-full border p-2 rounded">
                            <option value="">Nessuno</option>
                            ${db.gruppi.map(g => `<option value="${g.id}" ${m && m.gruppoId == g.id ? 'selected' : ''}>${g.nome}</option>`).join('')}
                        </select>
                    </div>
                    <div class="bg-gray-50 p-3 rounded grid grid-cols-2 gap-2 text-xs font-bold uppercase">
                        <label><input type="checkbox" id="panziano" ${m && m.privilegi?.anziano ? 'checked' : ''}> Anziano</label>
                        <label><input type="checkbox" id="pservitore" ${m && m.privilegi?.servitore ? 'checked' : ''}> Servitore Min.</label>
                        <label><input type="checkbox" id="ppioniereR" ${m && m.privilegi?.pioniereR ? 'checked' : ''}> Pioniere Reg.</label>
                        <label><input type="checkbox" id="punto" ${m && m.privilegi?.unto ? 'checked' : ''}> Unto</label>
                    </div>
                    <button onclick="salvaMembro()" class="w-full bg-indigo-600 text-white p-3 rounded font-bold mt-4">SALVA PROFILO</button>
                    ${id ? `<button onclick="eliminaMembro(${id})" class="w-full bg-red-100 text-red-600 p-2 rounded font-bold mt-2 text-xs">ELIMINA</button>` : ''}
                </div>`;
            apriModal("Scheda S-21", h);
        }

        function salvaMembro() {
            const id = parseInt(document.getElementById('pid').value);
            const dati = {
                id,
                nome: document.getElementById('pnome').value,
                cognome: document.getElementById('pcognome').value,
                indirizzo: document.getElementById('pindirizzo').value,
                telefono: document.getElementById('ptelefono').value,
                nascita: document.getElementById('pnascita').value,
                battesimo: document.getElementById('pbattesimo').value,
                sesso: document.getElementById('psesso').value,
                gruppoId: document.getElementById('pgruppo').value || null,
                privilegi: {
                    anziano: document.getElementById('panziano').checked,
                    servitore: document.getElementById('pservitore').checked,
                    pioniereR: document.getElementById('ppioniereR').checked,
                    unto: document.getElementById('punto').checked
                },
                rapporti: db.membri.find(x => x.id === id)?.rapporti || {}
            };
            
            // Check duplicati ID
            const idx = db.membri.findIndex(x => x.id === id);
            if (idx >= 0) db.membri[idx] = dati; else db.membri.push(dati);
            
            salvaDB();
            chiudiModal();
            apriAnagrafica(); // Refresh view if open
        }

        function eliminaMembro(id) {
            if(confirm("Sei sicuro?")) {
                db.membri = db.membri.filter(x => x.id !== id);
                salvaDB();
                chiudiModal();
                apriAnagrafica();
            }
        }

        // --- FEATURE: RAPPORTI & MANCANTI ---
        function getMeseCorrente() { return MESI[new Date().getMonth()]; } // Semplificato per demo
        
        function vistaInserisciRapporto() {
            let h = `<div class="space-y-2">`;
            const ordinati = [...db.membri].sort((a,b) => a.cognome.localeCompare(b.cognome));
            ordinati.forEach(m => {
                h += `<div class="flex justify-between items-center bg-gray-50 p-3 rounded border">
                    <span class="font-bold text-sm">${m.cognome} ${m.nome}</span>
                    <button onclick="editaRapporto(${m.id})" class="text-xs bg-indigo-100 text-indigo-700 px-3 py-1 rounded font-bold">REPORT</button>
                </div>`;
            });
            apriSezione("Inserisci Rapporto", h + `</div>`);
        }

        function editaRapporto(id) {
            const m = db.membri.find(x => x.id === id);
            let h = `<div class="grid grid-cols-1 gap-2">`;
            MESI.forEach(mese => {
                const r = m.rapporti[mese] || {};
                h += `<div class="flex items-center gap-4 p-2 border-b">
                    <span class="w-24 text-sm font-bold uppercase text-gray-500">${mese}</span>
                    <label class="flex items-center gap-2 text-xs font-bold">
                        <input type="checkbox" onchange="toggleRapporto(${id}, '${mese}', this.checked)" ${r.partecipato ? 'checked' : ''}> 
                        Partecipato
                    </label>
                </div>`;
            });
            apriModal("Rapporti: " + m.cognome, h + `</div>`);
        }

        function toggleRapporto(id, mese, val) {
            const m = db.membri.find(x => x.id === id);
            if(!m.rapporti[mese]) m.rapporti[mese] = {};
            m.rapporti[mese].partecipato = val;
            salvaDB();
        }

        function vistaMancanti() {
            const mese = getMeseCorrente(); // In un'app reale gestirei l'anno di servizio
            const mancanti = db.membri.filter(m => !m.rapporti[mese]?.partecipato);
            
            let msg = `*Rapporti mancanti ${mese}:*\n`;
            let h = `<div class="mb-4 font-bold text-red-600 uppercase text-sm">Mese: ${mese}</div>
                     <div class="space-y-2">`;
            
            mancanti.forEach(m => {
                msg += `- ${m.cognome} ${m.nome}\n`;
                h += `<div class="flex justify-between items-center p-3 bg-red-50 rounded border border-red-100">
                    <span class="font-bold text-sm text-gray-700">${m.cognome} ${m.nome}</span>
                    <button onclick="editaRapporto(${m.id})" class="text-xs bg-white border px-3 py-1 rounded font-bold">INSERISCI</button>
                </div>`;
            });
            h += `</div>`;

            // Bottone condividi lista
            const waLink = `https://wa.me/?text=${encodeURIComponent(msg)}`;
            const tgLink = `https://t.me/share/url?url=${encodeURIComponent(msg)}`;
            
            const actions = `<div class="flex gap-2">
                <a href="${waLink}" target="_blank" class="bg-green-500 text-white p-2 rounded text-xs font-bold">WA</a>
                <a href="${tgLink}" target="_blank" class="bg-blue-400 text-white p-2 rounded text-xs font-bold">TG</a>
            </div>`;
            
            apriSezione("Mancanti", h, actions);
        }

        // --- FEATURE: GRUPPI ---
        function nuovoGruppoModal() {
            let h = `<div class="space-y-4">
                <input type="text" id="gnome" placeholder="Nome Gruppo (es. Gruppo 1)" class="w-full border p-2 rounded">
                <input type="text" id="gsorv" placeholder="Sorvegliante" class="w-full border p-2 rounded">
                <input type="text" id="gass" placeholder="Assistente" class="w-full border p-2 rounded">
                <button onclick="salvaGruppo()" class="w-full bg-amber-500 text-white p-3 rounded font-bold">CREA GRUPPO</button>
            </div>`;
            apriModal("Nuovo Gruppo", h);
        }

        function salvaGruppo() {
            db.gruppi.push({
                id: Date.now(),
                nome: document.getElementById('gnome').value,
                sorvegliante: document.getElementById('gsorv').value,
                assistente: document.getElementById('gass').value
            });
            salvaDB();
            chiudiModal();
            alert("Gruppo creato!");
        }

        function vistaTuttiGruppi() {
            // Genera PDF con jsPDF-Autotable
            const doc = new jspdf.jsPDF();
            
            let finalY = 10;
            doc.text("Disposizione Gruppi di Servizio", 10, finalY);
            
            db.gruppi.forEach((g, i) => {
                const membri = db.membri.filter(m => m.gruppoId == g.id).map(m => [m.cognome + " " + m.nome, m.telefono]);
                doc.autoTable({
                    startY: finalY + 10,
                    head: [[`${g.nome} (Sorv: ${g.sorvegliante})`, 'Telefono']],
                    body: membri,
                    theme: 'grid'
                });
                finalY = doc.lastAutoTable.finalY + 5;
            });
            doc.save("Gruppi_Servizio.pdf");
        }

        async function apriRicercaGruppo() {
            let h = `<div class="space-y-2">`;
            db.gruppi.forEach(g => {
                h += `<div class="bg-gray-50 p-4 rounded border flex justify-between items-center">
                    <div>
                        <div class="font-bold text-lg">${g.nome}</div>
                        <div class="text-xs text-gray-500">Sorv: ${g.sorvegliante}</div>
                    </div>
                    <button onclick="scaricaZipGruppo(${g.id})" class="bg-amber-100 text-amber-800 p-2 rounded text-xs font-bold">📦 ZIP S-21</button>
                </div>`;
            });
            apriSezione("Elenco Gruppi", h + `</div>`);
        }

        async function scaricaZipGruppo(gid) {
            const membri = db.membri.filter(m => m.gruppoId == gid);
            if(membri.length === 0) return alert("Gruppo vuoto");
            
            const zip = new JSZip();
            try {
                // Fetch template
                const url = BASE_URL + FILES.s21;
                const existingPdfBytes = await fetch(url).then(res => res.arrayBuffer());
                
                for(const m of membri) {
                    const pdfDoc = await PDFLib.PDFDocument.load(existingPdfBytes);
                    // MAPPING CAMPI S-21
                    const form = pdfDoc.getForm();
                    try {
                        // Nomi generici, prova ad adattare se i campi sono diversi
                        const fields = form.getFields().map(f => f.getName());
                        
                        // Tentativo di riempimento standard
                        safeFill(form, 'Nome e cognome', `${m.nome} ${m.cognome}`); // Esempio
                        safeFill(form, 'Data di nascita', m.nascita);
                        safeFill(form, 'Data del battesimo', m.battesimo);
                        
                        // Checkbox (Nomi ipotetici basati su standard)
                        if(m.sesso === 'M') safeCheck(form, 'Maschio');
                        if(m.sesso === 'F') safeCheck(form, 'Femmina');
                        if(m.privilegi.anziano) safeCheck(form, 'Anziano');
                        if(m.privilegi.servitore) safeCheck(form, 'Servitore di ministero');
                        if(m.privilegi.pioniereR) safeCheck(form, 'Pioniere regolare');
                        
                        // Compilazione Tabella Mesi
                        MESI.forEach(mese => {
                           if(m.rapporti[mese]?.partecipato) {
                               safeCheck(form, `${mese}_Check`); // Ipotetico nome campo check nel PDF
                           }
                        });

                    } catch(e) { console.log(e); }

                    const pdfBytes = await pdfDoc.save();
                    zip.file(`${m.cognome}_${m.nome}.pdf`, pdfBytes);
                }
                
                const content = await zip.generateAsync({type:"blob"});
                const a = document.createElement("a");
                a.href = URL.createObjectURL(content);
                a.download = `Gruppo_${gid}_S21.zip`;
                a.click();
            } catch(e) {
                alert("Errore scaricamento Template PDF. Assicurati di essere online o su server locale. CORS Error.");
                console.error(e);
            }
        }

        // --- FEATURE: ANAGRAFICA COMPLETA ---
        function apriAnagrafica() {
            const ordinati = [...db.membri].sort((a,b) => a.cognome.localeCompare(b.cognome));
            
            let h = `<table class="w-full text-left text-xs">
                <thead class="bg-gray-100 uppercase text-gray-500">
                    <tr><th class="p-2">Nome</th><th class="p-2">Indirizzo</th><th class="p-2">Tel</th><th class="p-2 text-right">Azioni</th></tr>
                </thead>
                <tbody class="divide-y">`;
            
            ordinati.forEach(m => {
                h += `<tr>
                    <td class="p-3 font-bold text-indigo-900">${m.cognome} ${m.nome}</td>
                    <td class="p-3 text-gray-600">${m.indirizzo}</td>
                    <td class="p-3 text-gray-500 font-mono">${m.telefono}</td>
                    <td class="p-3 text-right">
                        <button onclick="nuovaScheda(${m.id})" class="text-blue-500 font-bold p-1">✏️</button>
                    </td>
                </tr>`;
            });
            h += `</tbody></table>`;

            const actions = `
                <button onclick="stampaListaAnagrafica()" class="bg-indigo-600 text-white px-3 py-1 rounded text-xs font-bold mr-2">PDF LISTA</button>
                <button onclick="zipTutti()" class="bg-gray-800 text-white px-3 py-1 rounded text-xs font-bold">ZIP ALL</button>
            `;
            apriSezione("Anagrafica Alfabetica", h, actions);
        }

        function stampaListaAnagrafica() {
            const doc = new jspdf.jsPDF();
            const dati = db.membri.sort((a,b)=>a.cognome.localeCompare(b.cognome))
                        .map(m => [m.cognome, m.nome, m.indirizzo, m.telefono]);
            doc.text("Anagrafica Congregazione", 14, 15);
            doc.autoTable({
                head: [['Cognome', 'Nome', 'Indirizzo', 'Telefono']],
                body: dati,
                startY: 20
            });
            doc.save("Anagrafica.pdf");
        }

        // --- FEATURE: S-88 ---
        function apriS88() {
            let html = `<div class="grid grid-cols-1 md:grid-cols-2 gap-4">`;
            MESI.forEach(mese => {
                const val = (db.s88["2024"] && db.s88["2024"][mese]) || {infra:"", week:""};
                html += `
                    <div class="bg-gray-50 p-3 rounded border">
                        <div class="font-bold text-xs uppercase mb-2 text-emerald-700">${mese}</div>
                        <div class="grid grid-cols-2 gap-2">
                            <input type="number" placeholder="Infrasett." value="${val.infra}" 
                                onchange="saveS88('${mese}', 'infra', this.value)" class="border p-1 rounded text-sm w-full">
                            <input type="number" placeholder="Fine Sett." value="${val.week}" 
                                onchange="saveS88('${mese}', 'week', this.value)" class="border p-1 rounded text-sm w-full">
                        </div>
                    </div>
                `;
            });
            apriSezione("Modulo S-88 (Anno in corso)", html + `</div>`);
        }

        function saveS88(mese, tipo, val) {
            if(!db.s88["2024"]) db.s88["2024"] = {};
            if(!db.s88["2024"][mese]) db.s88["2024"][mese] = {};
            db.s88["2024"][mese][tipo] = val;
            salvaDB();
        }

        async function scaricaPDF_S88() {
            try {
                const url = BASE_URL + FILES.s88;
                const bytes = await fetch(url).then(res => res.arrayBuffer());
                const pdfDoc = await PDFLib.PDFDocument.load(bytes);
                const form = pdfDoc.getForm();
                
                // Mappa i campi S-88
                MESI.forEach(m => {
                    const data = db.s88["2024"]?.[m];
                    if(data) {
                        // Nota: i nomi dei campi nel PDF devono essere indovinati o ispezionati.
                        // Qui uso una logica generica.
                        safeFill(form, `${m}_Infra`, data.infra);
                        safeFill(form, `${m}_Week`, data.week);
                    }
                });
                
                const pdfBytes = await pdfDoc.save();
                const blob = new Blob([pdfBytes], { type: "application/pdf" });
                const link = document.createElement('a');
                link.href = window.URL.createObjectURL(blob);
                link.download = "S-88_Compilato.pdf";
                link.click();
            } catch(e) {
                alert("Errore PDF S-88: " + e.message);
            }
        }

        // --- UTILITIES ---
        function safeFill(form, name, value) {
            try { form.getTextField(name).setText(String(value)); } catch(e) {}
        }
        function safeCheck(form, name) {
            try { form.getCheckBox(name).check(); } catch(e) {}
        }

        function esportaDati() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(db));
            const node = document.createElement('a');
            node.setAttribute("href", dataStr);
            node.setAttribute("download", "backup_anagrafica.json");
            document.body.appendChild(node);
            node.click();
            node.remove();
        }

        function importaDati(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    db = JSON.parse(e.target.result);
                    salvaDB();
                    location.reload();
                } catch(err) { alert("Errore file JSON"); }
            };
            reader.readAsText(file);
        }
