<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anagrafica Congregazione</title>

<link rel="manifest" href="manifest.json">
<link rel="icon" href="icona.png">
<meta name="theme-color" content="#7b1e2b">

<script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<style>
:root { --main:#7b1e2b; }
body { font-family:-apple-system; margin:0; background:#f2f2f2; }
header { background:var(--main); color:#fff; padding:12px; display:flex; align-items:center; gap:10px; }
header img { width:28px; }
main { padding:15px; }
button {
  width:100%; padding:14px; margin:6px 0;
  border:none; border-radius:14px;
  background:#fff; font-size:16px;
}
button.primary { background:var(--main); color:#fff; }
section { display:none; }
section.active { display:block; }
.card {
  background:#fff; padding:12px;
  border-radius:14px; margin-bottom:8px;
}
input, select {
  width:100%; padding:10px; margin:6px 0;
  border-radius:10px; border:1px solid #ccc;
}
</style>
</head>

<body>

<header>
  <img src="icona.png">
  <b>Anagrafica Congregazione</b>
</header>

<main>

<section id="home" class="active">
  <button onclick="shareApp()">📤 Condividi</button>
  <button class="primary" onclick="go('new')">➕ Nuova S-21</button>
  <button onclick="go('edit')">✏️ Inserisci rapporto</button>
  <button onclick="go('missing')">⚠️ Mancanti</button>
  <button onclick="go('s88')">📊 Modulo S-88</button>
  <button onclick="go('groups')">👥 Gruppi</button>
  <button onclick="go('pioneers')">🚲 Pionieri</button>
  <button onclick="go('registry')">📇 Anagrafica</button>
  <button onclick="go('archive')">🗄 Archivio</button>
  <button onclick="exportDB()">⬇️ Esporta dati</button>
  <button onclick="importDB()">⬆️ Importa dati</button>
</section>

<section id="new">
  <h3>Nuova S-21</h3>
  <input id="nome" placeholder="Nome">
  <input id="cognome" placeholder="Cognome">
  <input id="domicilio" placeholder="Domicilio">
  <input id="telefono" placeholder="Telefono">
  <label><input type="checkbox" id="pioniere"> Pioniere regolare</label>
  <button class="primary" onclick="addMember()">Salva</button>
  <button onclick="home()">Indietro</button>
</section>

<section id="edit">
  <h3>Profili</h3>
  <div id="members"></div>
  <button onclick="home()">Indietro</button>
</section>

<section id="missing">
  <h3>Mancanti mese corrente</h3>
  <div id="missingList"></div>
  <button onclick="shareMissing()">Condividi elenco</button>
  <button onclick="home()">Indietro</button>
</section>

<section id="groups">
  <h3>Gruppi</h3>
  <button onclick="createGroup()">➕ Nuovo gruppo</button>
  <div id="groupsList"></div>
  <button onclick="home()">Indietro</button>
</section>

<section id="pioneers">
  <h3>Pionieri</h3>
  <div id="pioneersList"></div>
  <button onclick="zipPioneers()">⬇️ ZIP cartoline</button>
  <button onclick="home()">Indietro</button>
</section>

<section id="registry">
  <h3>Anagrafica</h3>
  <div id="registryList"></div>
  <button onclick="home()">Indietro</button>
</section>

<section id="archive">
  <h3>Archivio PDF</h3>
  <div id="archiveList"></div>
  <button onclick="zipArchive()">⬇️ ZIP archivio</button>
  <button onclick="home()">Indietro</button>
</section>

<section id="s88">
  <h3>S-88</h3>
  <input id="annoS88" placeholder="Anno di servizio">
  <button class="primary" onclick="downloadS88()">Scarica PDF</button>
  <button onclick="home()">Indietro</button>
</section>

</main>

<script>
/* ===== DB ===== */
let db = JSON.parse(localStorage.getItem("db")) || {
  membri:[], gruppi:[], archivio:[]
};
const save=()=>localStorage.setItem("db",JSON.stringify(db));

/* ===== NAV ===== */
const go=id=>{
  document.querySelectorAll("section").forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  if(id==="edit") renderMembers();
  if(id==="missing") renderMissing();
  if(id==="groups") renderGroups();
  if(id==="pioneers") renderPioneers();
  if(id==="registry") renderRegistry();
  if(id==="archive") renderArchive();
};
const home=()=>go("home");

/* ===== SHARE ===== */
function shareApp(){
  navigator.share({title:"Anagrafica Congregazione",url:location.href});
}

/* ===== MEMBERS ===== */
function addMember(){
  db.membri.push({
    id:Date.now(),
    nome:nome.value,
    cognome:cognome.value,
    domicilio:domicilio.value,
    telefono:telefono.value,
    pioniere:pioniere.checked,
    rapporti:{}
  });
  save(); home();
}

function renderMembers(){
  members.innerHTML="";
  db.membri.sort((a,b)=>a.cognome.localeCompare(b.cognome)).forEach(m=>{
    let d=document.createElement("div");
    d.className="card";
    d.innerHTML=`${m.cognome} ${m.nome}
      <button onclick="downloadS21(${m.id})">📄 S-21</button>`;
    members.appendChild(d);
  });
}

/* ===== MISSING ===== */
function renderMissing(){
  missingList.innerHTML="";
  const key=new Date().getMonth();
  db.membri.filter(m=>!m.rapporti[key]).forEach(m=>{
    missingList.innerHTML+=`<div class="card">${m.cognome} ${m.nome}</div>`;
  });
}
function shareMissing(){
  let t=db.membri.filter(m=>!m.rapporti[new Date().getMonth()])
    .map(m=>`${m.cognome} ${m.nome}`).join("\n");
  navigator.share({text:t});
}

/* ===== GROUPS ===== */
function createGroup(){
  let t=prompt("Nome gruppo");
  if(!t)return;
  db.gruppi.push({id:Date.now(),titolo:t,membri:[]});
  save(); renderGroups();
}
function renderGroups(){
  groupsList.innerHTML="";
  db.gruppi.sort((a,b)=>a.titolo.localeCompare(b.titolo)).forEach(g=>{
    groupsList.innerHTML+=`<div class="card">${g.titolo}</div>`;
  });
}

/* ===== PIONEERS ===== */
function renderPioneers(){
  pioneersList.innerHTML="";
  db.membri.filter(m=>m.pioniere)
    .sort((a,b)=>a.cognome.localeCompare(b.cognome))
    .forEach(m=>{
      pioneersList.innerHTML+=`<div class="card">${m.cognome} ${m.nome}</div>`;
    });
}
async function zipPioneers(){
  zipMembers(db.membri.filter(m=>m.pioniere),"pionieri.zip");
}

/* ===== REGISTRY ===== */
function renderRegistry(){
  registryList.innerHTML="";
  db.membri.sort((a,b)=>a.cognome.localeCompare(b.cognome))
    .forEach(m=>{
      registryList.innerHTML+=
        `<div class="card">${m.cognome} ${m.nome}<br>${m.telefono}</div>`;
    });
}

/* ===== ARCHIVE ===== */
function renderArchive(){
  archiveList.innerHTML="";
  db.archivio.forEach(a=>{
    archiveList.innerHTML+=`<div class="card">${a.nome}</div>`;
  });
}
async function zipArchive(){
  let zip=new JSZip();
  db.archivio.forEach(a=>{
    zip.file(a.nome,a.bytes);
  });
  download(await zip.generateAsync({type:"blob"}),"archivio.zip");
}

/* ===== PDF ===== */
async function downloadS21(id){
  const m=db.membri.find(x=>x.id===id);
  const buf=await fetch("templates/S-21_I.pdf").then(r=>r.arrayBuffer());
  const pdf=await PDFLib.PDFDocument.load(buf);
  const f=pdf.getForm();
  f.getTextField("Nome e cognome").setText(`${m.nome} ${m.cognome}`);
  f.flatten();
  const bytes=await pdf.save();
  db.archivio.push({nome:`S-21_${m.cognome}.pdf`,bytes});
  save();
  download(new Blob([bytes]),`S-21_${m.cognome}.pdf`);
}

async function downloadS88(){
  const buf=await fetch("templates/S-88_I.pdf").then(r=>r.arrayBuffer());
  const pdf=await PDFLib.PDFDocument.load(buf);
  pdf.getForm().getTextField("Service Year_1").setText(annoS88.value);
  const bytes=await pdf.save();
  download(new Blob([bytes]),"S-88.pdf");
}

/* ===== ZIP ===== */
async function zipMembers(list,name){
  let zip=new JSZip();
  for(let m of list){
    const buf=await fetch("templates/S-21_I.pdf").then(r=>r.arrayBuffer());
    const pdf=await PDFLib.PDFDocument.load(buf);
    pdf.getForm().getTextField("Nome e cognome").setText(`${m.nome} ${m.cognome}`);
    zip.file(`${m.cognome}.pdf`,await pdf.save());
  }
  download(await zip.generateAsync({type:"blob"}),name);
}

/* ===== UTIL ===== */
function download(blob,name){
  let a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=name;
  a.click();
}
function exportDB(){
  download(new Blob([JSON.stringify(db)]),"backup.json");
}
function importDB(){
  let i=document.createElement("input");
  i.type="file";
  i.onchange=e=>{
    let r=new FileReader();
    r.onload=()=>{db=JSON.parse(r.result);save();alert("Importato");};
    r.readAsText(e.target.files[0]);
  };
  i.click();
}

/* ===== SW ===== */
if("serviceWorker" in navigator){
  navigator.serviceWorker.register("sw.js");
}
</script>

</body>
</html>
