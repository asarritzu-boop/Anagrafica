<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#800020">
    <title>Anagrafica Congregazione</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        bordeaux: { DEFAULT: '#800020', 600: '#800020', 700: '#6b001b' }
                    }
                }
            }
        }
    </script>

    <style>
        body { -webkit-tap-highlight-color: transparent; font-family: -apple-system, system-ui, sans-serif; }
        .hidden-page { display: none !important; }
        .page-content { animation: fadeIn 0.2s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 pb-24 select-none">

    <header class="bg-bordeaux text-white p-4 shadow-lg sticky top-0 z-50">
        <div class="max-w-2xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-2">
                <img src="icona-192.png" alt="icon" class="w-8 h-8 rounded-lg border border-white/20">
                <div class="font-bold text-sm leading-tight uppercase tracking-wide">Anagrafica<br>Congregazione</div>
            </div>
            <div class="flex gap-2 items-center">
                <button onclick="condividiApp()" class="bg-white/10 p-2 rounded-full hover:bg-white/20">
                    <span class="text-lg">🔗</span>
                </button>
                <div id="installBtnContainer"></div>
            </div>
        </div>
    </header>

    <main class="max-w-2xl mx-auto p-4">

        <div id="dashboard" class="page-content space-y-4">
            
            <div class="bg-white p-5 rounded-3xl shadow-sm border border-gray-200">
                <h2 class="text-bordeaux font-black text-xs uppercase tracking-widest mb-4 flex items-center gap-2">
                    <span>👤</span> Membri & S-21
                </h2>
                <div class="space-y-3">
                    <button onclick="nuovaScheda()" class="w-full bg-bordeaux text-white py-4 rounded-2xl font-bold shadow-lg active:scale-95 transition">
                        + NUOVA SCHEDA S-21
                    </button>
                    <div class="grid grid-cols-2 gap-3">
                        <button onclick="mostraPagina('page-rapporti')" class="bg-gray-50 text-gray-700 py-3 rounded-xl font-bold text-[10px] border uppercase">📝 Inserisci Rapp.</button>
                        <button onclick="mostraPagina('page-mancanti')" class="bg-red-50 text-red-700 py-3 rounded-xl font-bold text-[10px] border border-red-100 uppercase">⚠️ Mancanti</button>
                    </div>
                    <button onclick="mostraPagina('page-anagrafica')" class="w-full bg-gray-50 text-bordeaux border border-gray-200 py-3 rounded-xl font-bold text-sm">🔤 APRI ANAGRAFICA COMPLETA</button>
                </div>
            </div>

            <div class="bg-white p-5 rounded-3xl shadow-sm border border-gray-200">
                <h2 class="text-bordeaux font-black text-xs uppercase tracking-widest mb-4 flex items-center gap-2">
                    <span>👥</span> Gruppi & Servizio
                </h2>
                <div class="grid grid-cols-2 gap-3 mb-3">
                    <button onclick="mostraPagina('page-gruppi')" class="bg-amber-500 text-white py-4 rounded-2xl font-bold text-xs uppercase shadow-md">📂 Lista Gruppi</button>
                    <button onclick="mostraPagina('page-pionieri')" class="bg-blue-700 text-white py-4 rounded-2xl font-bold text-xs uppercase shadow-md">⭐ Pionieri</button>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <button onclick="mostraPagina('page-archivio')" class="bg-gray-800 text-white py-3 rounded-xl font-bold text-[10px] uppercase">📁 Archivio Moduli</button>
                    <button onclick="apriPaginaS88()" class="bg-blue-100 text-blue-800 py-3 rounded-xl font-bold text-[10px] uppercase">📊 Modulo S-88</button>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <button onclick="esportaDati()" class="bg-white p-4 rounded-2xl border text-center">
                    <div class="text-xl">📤</div>
                    <div class="text-[10px] font-bold uppercase mt-1">Backup</div>
                </button>
                <label class="bg-white p-4 rounded-2xl border text-center cursor-pointer">
                    <div class="text-xl">📥</div>
                    <div class="text-[10px] font-bold uppercase mt-1">Importa</div>
                    <input type="file" class="hidden" accept=".json" onchange="importaDati(event)">
                </label>
            </div>
        </div>

        <div id="page-pionieri" class="page-content hidden-page bg-white min-h-[80vh] rounded-t-3xl shadow-2xl mt-4">
            <div class="sticky top-0 bg-blue-700 text-white p-4 rounded-t-3xl border-b flex justify-between items-center z-10">
                <button onclick="tornaHome()" class="bg-white/20 px-3 py-2 rounded-xl font-bold text-[10px]">← CHIUDI</button>
                <h2 class="font-bold uppercase text-sm">Elenco Pionieri</h2>
                <button onclick="zipPionieri()" class="bg-white text-blue-700 px-3 py-2 rounded-xl font-bold text-[10px] uppercase shadow-lg">📦 ZIP Totale</button>
            </div>
            <div id="lista-pionieri" class="p-4 space-y-2"></div>
        </div>

        <div id="page-archivio" class="page-content hidden-page bg-white min-h-[80vh] rounded-t-3xl shadow-2xl mt-4">
            <div class="sticky top-0 bg-gray-800 text-white p-4 rounded-t-3xl border-b flex justify-between items-center z-10">
                <button onclick="tornaHome()" class="bg-white/20 px-3 py-2 rounded-xl font-bold text-[10px]">← CHIUDI</button>
                <h2 class="font-bold uppercase text-sm">Archivio Documenti</h2>
            </div>
            <div class="p-6 space-y-6">
                <div>
                    <h3 class="text-xs font-black text-gray-400 uppercase mb-3">Moduli S-88 (Adunanze)</h3>
                    <div id="archivio-s88" class="grid grid-cols-1 gap-2"></div>
                </div>
                <hr>
                <div>
                    <h3 class="text-xs font-black text-gray-400 uppercase mb-3">Moduli S-21 (Cartoline)</h3>
                    <button onclick="zipTutti()" class="w-full py-3 bg-bordeaux/10 text-bordeaux rounded-xl font-bold text-xs uppercase mb-2">Scarica Tutte le S-21 (.ZIP)</button>
                    <div id="archivio-s21" class="text-[10px] text-gray-500 italic text-center">Accedi all'anagrafica per i singoli download</div>
                </div>
            </div>
        </div>

        <div id="page-anagrafica" class="page-content hidden-page bg-white min-h-[80vh] rounded-t-3xl shadow-2xl mt-4">
            <div class="sticky top-0 bg-gray-50 p-4 rounded-t-3xl border-b flex justify-between items-center z-10">
                <button onclick="tornaHome()" class="bg-gray-200 px-4 py-2 rounded-xl font-bold text-xs">← INDIETRO</button>
                <h2 class="font-bold text-bordeaux uppercase">Anagrafica</h2>
                <div class="flex gap-2">
                    <button onclick="stampaListaAnagrafica()" class="bg-white border p-2 rounded-lg text-lg">📄</button>
                    <button onclick="zipTutti()" class="bg-bordeaux text-white p-2 rounded-lg text-lg">📦</button>
                </div>
            </div>
            <div id="lista-anagrafica" class="p-4 space-y-2"></div>
        </div>
        
        <div id="page-gruppi" class="page-content hidden-page bg-white min-h-[80vh] rounded-t-3xl shadow-2xl mt-4">
            <div class="sticky top-0 bg-gray-50 p-4 rounded-t-3xl border-b flex justify-between items-center z-10">
                <button onclick="tornaHome()" class="bg-gray-200 px-4 py-2 rounded-xl font-bold text-xs">← INDIETRO</button>
                <h2 class="font-bold text-amber-600 uppercase">Gruppi</h2>
                <button onclick="vistaTuttiGruppiPDF()" class="bg-amber-500 text-white px-3 py-2 rounded-xl font-bold text-xs uppercase">📄 PDF Lista</button>
            </div>
            <div id="lista-gruppi" class="p-4 space-y-3"></div>
        </div>
        </main>

    <div id="modal" class="fixed inset-0 z-[60] bg-black/60 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-lg rounded-3xl shadow-2xl overflow-hidden max-h-[90vh] flex flex-col">
            <div class="p-4 border-b flex justify-between items-center bg-gray-50">
                <h3 id="modalTitle" class="font-bold text-lg text-bordeaux">Modifica</h3>
                <button onclick="chiudiModal()" class="w-8 h-8 rounded-full bg-gray-200 font-bold">✕</button>
            </div>
            <div id="modalBody" class="p-6 overflow-y-auto"></div>
        </div>
    </div>

    <script>
        // CONFIGURAZIONE & DB (Mantieni le tue logiche esistenti)
        const BASE_URL = "https://asarritzu-boop.github.io/Anagrafica/";
        const FILES = { s21: "S-21_I.pdf", s88: "S-88_1.pdf" };
        const MESI = ["Settembre", "Ottobre", "Novembre", "Dicembre", "Gennaio", "Febbraio", "Marzo", "Aprile", "Maggio", "Giugno", "Luglio", "Agosto"];
        
        let db = JSON.parse(localStorage.getItem('jw_db_v2')) || { membri: [], gruppi: [], s88: {} };
        function salvaDB() { localStorage.setItem('jw_db_v2', JSON.stringify(db)); }

        // NAVIGAZIONE
        function mostraPagina(pageId) {
            document.querySelectorAll('.page-content').forEach(el => el.classList.add('hidden-page'));
            document.getElementById(pageId).classList.remove('hidden-page');
            window.scrollTo(0,0);
            if(pageId === 'page-pionieri') renderPionieri();
            if(pageId === 'page-archivio') renderArchivio();
            if(pageId === 'page-anagrafica') renderAnagrafica();
            if(pageId === 'page-gruppi') renderGruppi();
        }
        function tornaHome() {
            document.querySelectorAll('.page-content').forEach(el => el.classList.add('hidden-page'));
            document.getElementById('dashboard').classList.remove('hidden-page');
        }

        // --- FUNZIONE CONDIVIDI ---
        async function condividiApp() {
            const shareData = {
                title: 'Anagrafica JW',
                text: 'Accedi all\'app Anagrafica Congregazione:',
                url: window.location.href
            };
            try {
                if (navigator.share) {
                    await navigator.share(shareData);
                } else {
                    const text = `${shareData.text} ${shareData.url}`;
                    window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
                }
            } catch (err) { console.log("Errore condivisione"); }
        }

        // --- GESTIONE PIONIERI ---
        function renderPionieri() {
            const container = document.getElementById('lista-pionieri');
            container.innerHTML = "";
            const pionieri = db.membri.filter(m => m.privilegi.pioniereR)
                                     .sort((a,b) => a.cognome.localeCompare(b.cognome));

            if(pionieri.length === 0) {
                container.innerHTML = "<p class='text-center p-10 text-gray-400 text-sm'>Nessun pioniere regolare registrato.</p>";
                return;
            }

            pionieri.forEach(p => {
                const g = db.gruppi.find(x => x.id == p.gruppoId);
                container.innerHTML += `
                    <div class="flex justify-between items-center p-4 bg-gray-50 rounded-2xl border border-gray-100 shadow-sm">
                        <div>
                            <div class="font-bold text-blue-800 text-sm">${p.cognome} ${p.nome}</div>
                            <div class="text-[9px] text-gray-500 uppercase font-bold">${g ? g.nome : 'Nessun Gruppo'}</div>
                        </div>
                        <button onclick="scaricaSingolaS21(${p.id})" class="bg-white border-2 border-blue-100 p-2 rounded-xl text-xs">📄 PDF</button>
                    </div>`;
            });
        }

        async function scaricaSingolaS21(mid) {
            const m = db.membri.find(x => x.id === mid);
            const url = BASE_URL + FILES.s21;
            const bytes = await fetch(url).then(res => res.arrayBuffer());
            const pdfDoc = await PDFLib.PDFDocument.load(bytes);
            const form = pdfDoc.getForm();
            
            // Logica compilazione campI (uguale alla funzione scaricaZipGruppo)
            try {
                form.getTextField('Nome e cognome').setText(`${m.cognome} ${m.nome}`);
                // ... aggiungi altri campi
            } catch(e){}

            const pdfBytes = await pdfDoc.save();
            scaricaBlob(pdfBytes, `S21_${m.cognome}.pdf`);
        }

        async function zipPionieri() {
            const pionieri = db.membri.filter(m => m.privilegi.pioniereR);
            if(pionieri.length === 0) return alert("Nessun pioniere!");
            alert("Generazione ZIP Pionieri...");
            const zip = new JSZip();
            const template = await fetch(BASE_URL + FILES.s21).then(res => res.arrayBuffer());

            for(const m of pionieri) {
                const pdfDoc = await PDFLib.PDFDocument.load(template);
                const form = pdfDoc.getForm();
                try { form.getTextField('Nome e cognome').setText(`${m.cognome} ${m.nome}`); } catch(e){}
                const pdfBytes = await pdfDoc.save();
                zip.file(`PIONIERE_${m.cognome}_${m.nome}.pdf`, pdfBytes);
            }
            const content = await zip.generateAsync({type:"blob"});
            scaricaBlob(content, "Cartoline_Pionieri.zip");
        }

        // --- GESTIONE ARCHIVIO ---
        function renderArchivio() {
            const contS88 = document.getElementById('archivio-s88');
            contS88.innerHTML = "";
            
            // Esempio per anno in corso
            const anni = ["2024", "2025"]; 
            anni.forEach(anno => {
                const hasData = db.s88[anno];
                contS88.innerHTML += `
                    <div class="flex justify-between items-center p-3 bg-gray-50 rounded-xl border">
                        <span class="font-bold text-xs uppercase">Riepilogo Adunanze S-88 (${anno})</span>
                        <div class="flex gap-2">
                            <button onclick="apriPaginaS88()" class="text-[10px] bg-white border px-2 py-1 rounded-md">MODIFICA</button>
                            <button onclick="scaricaPDF_S88()" class="text-[10px] bg-blue-600 text-white px-2 py-1 rounded-md">DOWNLOAD</button>
                        </div>
                    </div>`;
            });
        }

        // --- UTILS ---
        function scaricaBlob(data, nome) {
            const a = document.createElement('a');
            a.href = URL.createObjectURL(new Blob([data]));
            a.download = nome; a.click();
        }

        function chiudiModal() { document.getElementById('modal').classList.add('hidden'); }
        function apriModal(titolo, html) {
            document.getElementById('modalTitle').innerText = titolo;
            document.getElementById('modalBody').innerHTML = html;
            document.getElementById('modal').classList.remove('hidden');
        }

        // [Incolla qui il resto delle tue funzioni: salvaMembroDB, eliminaMembro, renderAnagrafica, renderGruppi, etc.]
    </script>
</body>
</html>
