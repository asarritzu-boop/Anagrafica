<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#800020">
    <title>Anagrafica Congregazione</title>

    <link rel="apple-touch-icon" href="icona-192.png">
    <link rel="icon" type="image/png" href="icona-192.png">
    
    <link rel="manifest" href='data:application/manifest+json,{"name":"Anagrafica JW","short_name":"Anagrafica","start_url":".","display":"standalone","background_color":"#800020","theme_color":"#800020","icons":[{"src":"icona-192.png","sizes":"192x192","type":"image/png"},{"src":"icona-512.png","sizes":"512x512","type":"image/png"}]}'>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        bordeaux: { DEFAULT: '#800020', 600: '#800020', 700: '#6b001b' }
                    }
                }
            }
        }
    </script>

    <style>
        body { -webkit-tap-highlight-color: transparent; font-family: -apple-system, system-ui, sans-serif; overflow-x: hidden; }
        .hidden-page { display: none !important; }
        .active-tab { border-bottom: 3px solid #800020; color: #800020; }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .animate-up { animation: slideUp 0.3s ease-out; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 pb-24">

    <header class="bg-bordeaux text-white p-4 shadow-lg sticky top-0 z-50">
        <div class="max-w-2xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <img src="icona-192.png" class="w-10 h-10 rounded-xl shadow-md border border-white/20" alt="Logo">
                <div>
                    <h1 class="font-black text-sm uppercase tracking-tighter">Congregazione</h1>
                    <p class="text-[10px] opacity-80 uppercase">Gestione Anagrafica</p>
                </div>
            </div>
            <div id="pwa-install-zone"></div>
        </div>
    </header>

    <main class="max-w-2xl mx-auto p-4">

        <div id="dashboard" class="page-content space-y-4 animate-up">
            <div class="bg-white p-6 rounded-3xl shadow-sm border border-gray-200">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-bordeaux font-black text-xs uppercase tracking-widest">Anagrafica & S-21</h2>
                    <span class="bg-bordeaux/10 text-bordeaux text-[10px] px-2 py-1 rounded-full font-bold" id="count-membri">0 MEMBRI</span>
                </div>
                
                <div class="grid grid-cols-1 gap-3">
                    <button onclick="nuovaScheda()" class="w-full bg-bordeaux text-white py-4 rounded-2xl font-bold shadow-lg active:scale-95 transition">
                        + AGGIUNGI PROCLAMATORE
                    </button>
                    <div class="grid grid-cols-2 gap-3">
                        <button onclick="mostraPagina('page-anagrafica')" class="bg-gray-800 text-white py-4 rounded-2xl font-bold text-xs uppercase">Lista Completa</button>
                        <button onclick="mostraPagina('page-pionieri')" class="bg-blue-700 text-white py-4 rounded-2xl font-bold text-xs uppercase">Pionieri</button>
                    </div>
                </div>
            </div>

            <div class="bg-white p-6 rounded-3xl shadow-sm border border-gray-200">
                <h2 class="text-bordeaux font-black text-xs uppercase tracking-widest mb-4">Servizio & Gruppi</h2>
                <div class="grid grid-cols-2 gap-3">
                    <button onclick="mostraPagina('page-gruppi')" class="bg-amber-500 text-white py-4 rounded-2xl font-bold text-xs uppercase shadow-md">Gruppi</button>
                    <button onclick="scaricaS88()" class="bg-emerald-600 text-white py-4 rounded-2xl font-bold text-xs uppercase shadow-md">Modulo S-88</button>
                </div>
            </div>

            <div class="bg-white p-6 rounded-3xl shadow-sm border border-gray-200">
                <h2 class="text-bordeaux font-black text-xs uppercase tracking-widest mb-4">Backup & Archivio</h2>
                <div class="grid grid-cols-2 gap-3">
                    <button onclick="esportaDati()" class="flex flex-col items-center justify-center p-4 border-2 border-dashed rounded-2xl hover:bg-gray-50">
                        <span class="text-xl">📤</span>
                        <span class="text-[10px] font-bold uppercase">Esporta</span>
                    </button>
                    <label class="flex flex-col items-center justify-center p-4 border-2 border-dashed rounded-2xl hover:bg-gray-50 cursor-pointer">
                        <span class="text-xl">📥</span>
                        <span class="text-[10px] font-bold uppercase">Importa</span>
                        <input type="file" class="hidden" accept=".json" onchange="importaDati(event)">
                    </label>
                </div>
                <button onclick="mostraPagina('page-archivio')" class="w-full mt-4 py-3 text-gray-500 font-bold text-xs uppercase">Archivio Esportazioni ZIP</button>
            </div>
        </div>

        <div id="page-anagrafica" class="page-content hidden-page animate-up">
            <div class="flex items-center gap-4 mb-6">
                <button onclick="tornaHome()" class="p-2 bg-white rounded-full shadow-sm">⬅️</button>
                <h2 class="font-black text-bordeaux uppercase">Elenco Membri</h2>
            </div>
            <div id="lista-membri-cont" class="space-y-3"></div>
        </div>

        <div id="page-gruppi" class="page-content hidden-page animate-up">
            <div class="flex items-center justify-between mb-6">
                <div class="flex items-center gap-4">
                    <button onclick="tornaHome()" class="p-2 bg-white rounded-full shadow-sm">⬅️</button>
                    <h2 class="font-black text-amber-600 uppercase">Gruppi di Servizio</h2>
                </div>
                <button onclick="creaGruppo()" class="bg-amber-500 text-white px-4 py-2 rounded-xl text-xs font-bold">+ NUOVO</button>
            </div>
            <div id="lista-gruppi-cont" class="space-y-4"></div>
        </div>

    </main>

    <div id="modal" class="fixed inset-0 z-[100] bg-black/60 backdrop-blur-sm hidden p-4 flex items-center justify-center">
        <div class="bg-white w-full max-w-md rounded-3xl shadow-2xl overflow-hidden animate-up">
            <div class="p-4 border-b flex justify-between items-center">
                <h3 id="modalTitle" class="font-bold text-bordeaux"></h3>
                <button onclick="chiudiModal()" class="text-2xl">&times;</button>
            </div>
            <div id="modalBody" class="p-6 overflow-y-auto max-h-[70vh]"></div>
        </div>
    </div>

    <script>
        // --- CONFIGURAZIONE FILE ---
        const PATH_S21 = "templates/S-21_I.pdf";
        const PATH_S88 = "templates/S-88_I.pdf";

        let db = JSON.parse(localStorage.getItem('jw_data')) || { membri: [], gruppi: [] };

        function salva() {
            localStorage.setItem('jw_data', JSON.stringify(db));
            aggiornaContatori();
        }

        function aggiornaContatori() {
            document.getElementById('count-membri').innerText = `${db.membri.length} MEMBRI`;
        }

        // --- PWA LOGIC ---
        let installPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            installPrompt = e;
            document.getElementById('pwa-install-zone').innerHTML = `
                <button onclick="avviaInstallazione()" class="bg-white text-bordeaux px-3 py-1.5 rounded-lg font-bold text-[10px] uppercase shadow-md">
                    Installa App
                </button>`;
        });

        async function avviaInstallazione() {
            if (!installPrompt) return;
            installPrompt.prompt();
            const { outcome } = await installPrompt.userChoice;
            if (outcome === 'accepted') document.getElementById('pwa-install-zone').innerHTML = '';
            installPrompt = null;
        }

        // --- GESTIONE MEMBRI ---
        function nuovaScheda() {
            const gruppiHtml = db.gruppi.map(g => `<option value="${g.id}">${g.nome}</option>`).join('');
            const html = `
                <form onsubmit="salvaMembro(event)" class="space-y-4">
                    <div class="grid grid-cols-2 gap-2">
                        <input type="text" name="cognome" placeholder="Cognome" class="p-3 border rounded-xl w-full" required>
                        <input type="text" name="nome" placeholder="Nome" class="p-3 border rounded-xl w-full" required>
                    </div>
                    <input type="text" name="indirizzo" placeholder="Indirizzo" class="p-3 border rounded-xl w-full">
                    <select name="gruppo" class="p-3 border rounded-xl w-full">
                        <option value="">Nessun Gruppo</option>
                        ${gruppiHtml}
                    </select>
                    <div class="flex items-center gap-3 p-3 bg-gray-50 rounded-xl">
                        <input type="checkbox" id="pioniere" name="pioniere" class="w-5 h-5 accent-bordeaux">
                        <label for="pioniere" class="font-bold text-xs uppercase">Pioniere Regolare</label>
                    </div>
                    <button type="submit" class="w-full bg-bordeaux text-white py-4 rounded-2xl font-bold uppercase">Salva Anagrafica</button>
                </form>
            `;
            apriModal("Nuovo Proclamatore", html);
        }

        function salvaMembro(e) {
            e.preventDefault();
            const fd = new FormData(e.target);
            const nuovo = {
                id: Date.now(),
                cognome: fd.get('cognome'),
                nome: fd.get('nome'),
                indirizzo: fd.get('indirizzo'),
                gruppoId: fd.get('gruppo'),
                isPioniere: fd.get('pioniere') === 'on'
            };
            db.membri.push(nuovo);
            salva();
            chiudiModal();
            if(confirm("Dati salvati. Vuoi scaricare ora la cartolina S-21?")) {
                compilaS21(nuovo);
            }
        }

        function renderAnagrafica() {
            const cont = document.getElementById('lista-membri-cont');
            cont.innerHTML = "";
            db.membri.sort((a,b) => a.cognome.localeCompare(b.cognome)).forEach(m => {
                cont.innerHTML += `
                    <div class="bg-white p-4 rounded-2xl shadow-sm border flex justify-between items-center">
                        <div>
                            <p class="font-bold text-sm">${m.cognome} ${m.nome}</p>
                            <p class="text-[10px] text-gray-400 uppercase">${m.isPioniere ? '⭐ Pioniere' : 'Proclamatore'}</p>
                        </div>
                        <div class="flex gap-2">
                            <button onclick='compilaS21(${JSON.stringify(m)})' class="p-2 bg-gray-100 rounded-lg">📄</button>
                            <button onclick="eliminaMembro(${m.id})" class="p-2 bg-red-50 text-red-500 rounded-lg">🗑️</button>
                        </div>
                    </div>`;
            });
        }

        // --- GESTIONE PDF (S-21 e S-88) ---
        async function compilaS21(membro) {
            try {
                const existingPdfBytes = await fetch(PATH_S21).then(res => res.arrayBuffer());
                const pdfDoc = await PDFLib.PDFDocument.load(existingPdfBytes);
                const form = pdfDoc.getForm();

                // Mappatura campi PDF (assicurati che i nomi corrispondano nel file PDF)
                form.getTextField('Nome e cognome').setText(`${membro.cognome} ${membro.nome}`);
                if(membro.indirizzo) try { form.getTextField('Indirizzo').setText(membro.indirizzo); } catch(e){}

                const pdfBytes = await pdfDoc.save();
                scaricaFile(pdfBytes, `S-21_${membro.cognome}.pdf`, "application/pdf");
            } catch (err) {
                alert("Errore nel caricamento del file S-21_I.pdf dalla cartella templates/");
                console.error(err);
            }
        }

        async function scaricaS88() {
            try {
                const bytes = await fetch(PATH_S88).then(res => res.arrayBuffer());
                scaricaFile(bytes, "S-88_I.pdf", "application/pdf");
            } catch (err) { alert("File S-88_I.pdf non trovato in templates/"); }
        }

        // --- UTILS ---
        function scaricaFile(data, nome, tipo) {
            const blob = new Blob([data], { type: tipo });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = nome;
            link.click();
        }

        function mostraPagina(id) {
            document.querySelectorAll('.page-content').forEach(p => p.classList.add('hidden-page'));
            document.getElementById(id).classList.remove('hidden-page');
            if(id === 'page-anagrafica') renderAnagrafica();
            if(id === 'page-gruppi') renderGruppi();
        }

        function tornaHome() {
            document.querySelectorAll('.page-content').forEach(p => p.classList.add('hidden-page'));
            document.getElementById('dashboard').classList.remove('hidden-page');
        }

        function apriModal(titolo, html) {
            document.getElementById('modalTitle').innerText = titolo;
            document.getElementById('modalBody').innerHTML = html;
            document.getElementById('modal').classList.remove('hidden');
        }

        function chiudiModal() { document.getElementById('modal').classList.add('hidden'); }

        function esportaDati() {
            const blob = new Blob([JSON.stringify(db)], {type: "application/json"});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `backup_congregazione_${new Date().toISOString().split('T')[0]}.json`;
            a.click();
        }

        function importaDati(e) {
            const reader = new FileReader();
            reader.onload = (event) => {
                db = JSON.parse(event.target.result);
                salva();
                location.reload();
            };
            reader.readAsText(e.target.files[0]);
        }

        // Caricamento iniziale
        aggiornaContatori();
    </script>
</body>
</html>
