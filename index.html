<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Anagrafica Congregazione</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: { extend: { colors: { bordeaux: '#800020' } } }
        }
    </script>
    
    <script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <style>
        body { -webkit-tap-highlight-color: transparent; }
        .modal-bg { background-color: rgba(0, 0, 0, 0.5); backdrop-filter: blur(4px); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 font-sans no-scrollbar pb-10">

    <div class="max-w-4xl mx-auto p-6">
        <header class="flex justify-between items-center mb-10">
            <div class="flex items-center gap-4">
                <img src="icona.png" alt="Logo" class="w-12 h-12 rounded-2xl shadow-lg border-2 border-white object-cover">
                <div>
                    <h1 class="text-3xl font-black text-bordeaux tracking-tight uppercase">Dashboard</h1>
                    <p class="text-xs font-bold text-gray-400 uppercase tracking-widest">S-21 & S-88</p>
                </div>
            </div>
            <button onclick="condividiApp()" class="bg-white p-3 rounded-full shadow-sm border border-gray-100 active:scale-90 transition">🔗</button>
        </header>

        <div class="bg-white p-6 rounded-[2.5rem] shadow-xl shadow-gray-200/50 border border-gray-50 mb-6">
            <div class="flex items-center gap-4 mb-6">
                <div class="bg-red-50 p-3 rounded-2xl text-2xl">👤</div>
                <h2 class="text-xl font-bold">Membri e Rapporti S-21</h2>
            </div>
            <div class="grid grid-cols-1 gap-3">
                <button onclick="apriModalNuovoMembro()" class="w-full py-4 bg-bordeaux text-white rounded-2xl font-bold shadow-lg active:scale-95 transition uppercase text-sm tracking-widest">Nuova Scheda S-21</button>
                <div class="grid grid-cols-2 gap-3">
                    <button onclick="vaiAElencoProfili()" class="py-4 bg-gray-100 text-gray-700 rounded-2xl font-bold active:scale-95 transition uppercase text-[10px] tracking-widest text-center">Inserisci Rapporto</button>
                    <button onclick="controllaRapportiMancanti()" class="py-4 bg-gray-100 text-gray-700 rounded-2xl font-bold active:scale-95 transition uppercase text-[10px] tracking-widest text-center">Verifica Mancanti</button>
                </div>
            </div>
        </div>

        <div class="bg-white p-6 rounded-[2.5rem] shadow-xl shadow-gray-200/50 border border-gray-50 mb-12">
            <div class="flex items-center gap-4 mb-6">
                <div class="bg-blue-50 p-3 rounded-2xl text-2xl">📊</div>
                <h2 class="text-xl font-bold">Statistiche Adunanze S-88</h2>
            </div>
            <button onclick="apriEditorS88()" class="w-full py-4 bg-blue-600 text-white rounded-2xl font-bold shadow-lg active:scale-95 transition uppercase text-sm tracking-widest">Compila S-88</button>
        </div>

        <h3 class="text-[10px] font-black text-gray-400 uppercase tracking-[0.2em] mb-4 ml-2">Organizzazione</h3>
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-12">
            <button onclick="mostraGestioneGruppi()" class="bg-white p-4 rounded-3xl border border-gray-100 shadow-sm flex flex-col items-center gap-2">
                <span class="text-2xl">👥</span>
                <span class="text-[10px] font-bold uppercase">Gruppi</span>
            </button>
            <button onclick="mostraPionieri()" class="bg-white p-4 rounded-3xl border border-gray-100 shadow-sm flex flex-col items-center gap-2">
                <span class="text-2xl">🏃</span>
                <span class="text-[10px] font-bold uppercase">Pionieri</span>
            </button>
            <button onclick="visualizzaAnagrafica('alfabetico')" class="bg-white p-4 rounded-3xl border border-gray-100 shadow-sm flex flex-col items-center gap-2 text-center">
                <span class="text-2xl">🔤</span>
                <span class="text-[10px] font-bold uppercase">Anagrafica A-Z</span>
            </button>
            <button onclick="visualizzaAnagrafica('gruppi')" class="bg-white p-4 rounded-3xl border border-gray-100 shadow-sm flex flex-col items-center gap-2 text-center">
                <span class="text-2xl">📂</span>
                <span class="text-[10px] font-bold uppercase">Anagrafica Gruppi</span>
            </button>
        </div>

        <div class="bg-gray-900 p-6 rounded-[2.5rem] text-white flex justify-between items-center shadow-2xl mb-12">
            <div><p class="text-xs font-bold text-gray-400 uppercase">Storico</p><h3 class="text-xl font-bold">Archivio Annuale</h3></div>
            <button onclick="apriArchivio()" class="bg-white/10 p-4 rounded-2xl hover:bg-white/20 transition text-2xl">📁</button>
        </div>

        <h3 class="text-[10px] font-black text-gray-400 uppercase tracking-[0.2em] mb-4 ml-2">Sistema e Backup</h3>
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
            <button onclick="esportaBackup()" class="bg-white p-4 rounded-3xl border border-gray-100 shadow-sm flex flex-col items-center gap-2">
                <span class="text-2xl">📤</span>
                <span class="text-[10px] font-bold uppercase">Esporta</span>
            </button>
            <button onclick="document.getElementById('fileImport').click()" class="bg-white p-4 rounded-3xl border border-gray-100 shadow-sm flex flex-col items-center gap-2">
                <span class="text-2xl">📥</span>
                <span class="text-[10px] font-bold uppercase">Importa</span>
                <input type="file" id="fileImport" class="hidden" accept=".json" onchange="importaBackup(event)">
            </button>
            <button onclick="alert('Importa da PDF in arrivo')" class="bg-white p-4 rounded-3xl border border-gray-100 shadow-sm flex flex-col items-center gap-2">
                <span class="text-2xl">📄</span>
                <span class="text-[10px] font-bold uppercase">PDF S-21</span>
            </button>
            <button onclick="resetTotale()" class="bg-red-50 p-4 rounded-3xl border border-red-100 flex flex-col items-center gap-2">
                <span class="text-2xl">⚠️</span>
                <span class="text-[10px] font-bold text-red-600 uppercase">Reset</span>
            </button>
        </div>
    </div>

    <div id="mainModal" class="fixed inset-0 z-50 modal-bg hidden p-4 flex items-center justify-center">
        <div class="bg-white w-full max-w-lg rounded-[2.5rem] p-6 max-h-[90vh] overflow-y-auto shadow-2xl relative">
            <div id="modalContent"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
